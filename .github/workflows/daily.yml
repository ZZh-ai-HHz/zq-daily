name: zq-daily

# 09:30 与 17:30（北京时间）= 01:30 / 09:30 UTC
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'zq_auto.py'
      - 'push.py'
      - '.github/workflows/daily.yml'

permissions:
  contents: write

concurrency:
  group: zq-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装 numpy
        run: pip install --quiet numpy

      - name: 抓取官方盘口 + 让球体检
        run: python zq_auto.py --drift --msg out.txt

      - name: 推送手机
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          TITLE="竞彩让球体检 $(TZ=Asia/Shanghai date '+%m-%d %H:%M')"
          python push.py out.txt "$TITLE"

      - name: 回写快照（供下次算漂移）
        run: |
          git config user.name "zq-bot"
          git config user.email "zq-bot@users.noreply.github.com"
          git add zq_last.json
          git diff --quiet --cached && echo "无变化" || git commit -m "snapshot $(TZ=Asia/Shanghai date '+%F_%H:%M')"
          git push || echo "push skipped"
